data_dir: data
database_url: sqlite:///data/personal_wiki_agent.db

sources:
  - source_type: local_directory
    name: 本地学习资料
    uri: E:/Knowledge/Learning
    enabled: true
    ignore_patterns:
      - "*.tmp"
      - "~$*"

  - source_type: local_synced_notes
    name: 有道云笔记本地同步目录
    uri: E:/Knowledge/YoudaoSync
    enabled: true
    note_app: youdao

  - source_type: obsidian_vault
    name: Obsidian Vault
    uri: E:/Knowledge/ObsidianVault
    enabled: true
    note_app: obsidian

model:
  chat_provider: openai-compatible
  embedding_provider: openai-compatible
  local_provider: ollama
  providers:
    openai:
      type: openai_compatible
      base_url: https://api.openai.com/v1
      api_key_env: PERSONAL_WIKI_OPENAI_API_KEY
      enabled: false
      models:
        - id: chat-model
          display_name: OpenAI-compatible Chat
          capabilities:
            - chat
            - summary
        - id: embedding-model
          display_name: OpenAI-compatible Embedding
          capabilities:
            - embedding
          embedding_dimensions: 1536
    nvidia:
      type: openai_compatible
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: PERSONAL_WIKI_NVIDIA_API_KEY
      enabled: true
      models:
        - id: meta/llama-3.1-70b-instruct
          display_name: NVIDIA Llama 3.1 70B Instruct
          capabilities:
            - chat
            - summary
    ollama:
      type: ollama
      base_url: http://localhost:11434
      enabled: false
      models:
        - id: qwen3
          display_name: Qwen Local
          capabilities:
            - chat
            - local
          local: true
  defaults:
    chat: nvidia/meta/llama-3.1-70b-instruct
    summary: nvidia/meta/llama-3.1-70b-instruct
    embedding: openai/embedding-model

privacy:
  ignore_patterns:
    - "*.tmp"
    - "*.bak"
    - ".git/**"
    - "node_modules/**"
    - "__pycache__/**"
